<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>面积割补 - 数学乐园</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
    <link rel="stylesheet" th:href="@{/css/student.css}"/>
    <link rel="stylesheet" th:href="@{/css/area.css}"/>
</head>
<body>
<div class="layout">
    <nav th:replace="layout/common :: sidebar('area')"></nav>
    <div class="main">
        <header th:replace="layout/common :: header('面积割补')"></header>

        <div class="content area-content">

            <!-- 左：图形演示 -->
            <section class="area-card area-visual-card">
                <div class="area-stage" id="areaStage"></div>
            </section>

            <!-- 右：控制 + 面积结果 -->
            <section class="area-card area-panel">
                <h2>调一调</h2>

                <div class="ctrl">
                    <div class="ctrl-head">
                        <span class="ctrl-name">长度</span>
                        <span class="ctrl-val" id="lenVal">8 cm</span>
                    </div>
                    <input type="range" id="lenRange" min="2" max="10" step="0.5" value="8"
                           aria-label="长度"/>
                </div>

                <div class="ctrl">
                    <div class="ctrl-head">
                        <span class="ctrl-name">宽度</span>
                        <span class="ctrl-val" id="widVal">8 cm</span>
                    </div>
                    <input type="range" id="widRange" min="2" max="10" step="0.5" value="8"
                           aria-label="宽度"/>
                </div>

                <div class="ctrl">
                    <div class="ctrl-head">
                        <span class="ctrl-name">动态中线</span>
                        <span class="ctrl-val" id="midVal">4 cm</span>
                    </div>
                    <input type="range" id="midRange" min="0.5" max="7.5" step="0.5" value="4"
                           aria-label="动态中线"/>
                </div>

                <div class="ctrl-actions">
                    <button type="button" class="area-btn ghost" id="btnReset">↺ 恢复默认</button>
                    <button type="button" class="area-btn ghost" id="btnHalf">⇥ 平均分</button>
                </div>

                <div class="panel-areas">
                    <div class="area-line left">
                        <span class="area-label">左侧面积</span>
                        <span class="area-value"><b id="leftArea">32</b><i>cm²</i></span>
                    </div>
                    <div class="area-line right">
                        <span class="area-label">右侧面积</span>
                        <span class="area-value"><b id="rightArea">32</b><i>cm²</i></span>
                    </div>
                    <div class="area-line total">
                        <span class="area-label">总面积</span>
                        <span class="area-value"><b id="totalArea">64</b><i>cm²</i></span>
                    </div>
                </div>
            </section>

        </div>
    </div>
</div>

<script th:src="@{/js/area.js}"></script>
</body>
</html>
