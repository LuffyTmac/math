<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>重置密码 - 数学教学后台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div class="layout">
    <!-- 侧边栏 -->
    <nav th:replace="layout/common :: sidebar('user')"></nav>

    <!-- 主区域 -->
    <div class="main">
        <header th:replace="layout/common :: header('用户管理 / 重置密码')"></header>

        <div class="content">
            <div class="card">
                <div class="card-title">重置密码</div>

                <!-- 操作提示 -->
                <div th:if="${msg != null}" class="msg"
                     th:classappend="${msgType == 'success' ? 'msg-success' : 'msg-error'}"
                     th:text="${msg}">提示</div>

                <form th:action="@{/user/reset-password}" method="post" class="form">
                    <input type="hidden" name="id" th:value="${targetUser.id}"/>
                    <div class="form-row">
                        <label class="form-label">用户名</label>
                        <div class="form-control">
                            <input type="text" th:value="${targetUser.username}" readonly="readonly"/>
                            <div class="form-hint-inline">将重置该用户的密码</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label"><span class="req">*</span>新密码</label>
                        <div class="form-control">
                            <input type="password" name="newPassword" required="required"
                                   placeholder="请输入新密码（至少 6 位）"/>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label"><span class="req">*</span>确认新密码</label>
                        <div class="form-control">
                            <input type="password" name="confirmPassword" required="required"
                                   placeholder="请再次输入新密码"/>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">🔑 重置密码</button>
                        <a th:href="@{/user/list}" class="btn btn-default">← 返回列表</a>
                    </div>
                    <div class="form-hint">
                        新密码会使用 BCrypt 加密后存入数据库，无法逆向还原。
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
