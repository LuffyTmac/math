<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>后台首页 - 数学乐园</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
    <style>
        .quick-card .qd {
            margin-top: 4px;
            font-size: 12.5px;
            color: #8a99aa;
        }
    </style>
</head>
<body>
<div class="layout">
    <nav th:replace="layout/common :: sidebar('index')"></nav>

    <div class="main">
        <header th:replace="layout/common :: header('后台首页')"></header>

        <div class="content">
            <!-- 快捷入口 -->
            <div class="card">
                <div class="card-title">快捷入口</div>
                <div class="quick-grid">
                    <a th:href="@{/distributive/admin/list}" class="quick-card">
                        <div class="qi">🧩</div>
                        <div class="qt">分配律看板</div>
                        <div class="qd">题目卡片 + 学生算式归类</div>
                    </a>
                    <a th:href="@{/equation/admin/board}" class="quick-card">
                        <div class="qi">✍️</div>
                        <div class="qt">自定义等式看板</div>
                        <div class="qd">查看学生提交的等式</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
